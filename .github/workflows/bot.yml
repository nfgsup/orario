name: Bot compiti

on:
  schedule:
    # 12:00 e 13:00 UTC: una delle due corrisponde alle 14:00 italiane
    # (ora legale / ora solare). Lo script esegue solo nella finestra corretta.
    - cron: "0 12,13 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo della richiesta manuale"
        required: false
        default: "manuale"

concurrency:
  group: bot-compiti
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  aggiorna-compiti:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt
          playwright install --with-deps chromium

      - name: Aggiorna il ramo prima di scrivere
        run: git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Esegui il bot
        env:
          SCHOOL_USERNAME: ${{ secrets.SCHOOL_USERNAME }}
          SCHOOL_PASSWORD: ${{ secrets.SCHOOL_PASSWORD }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python bot/check_compiti.py --scheduled
          else
            python bot/check_compiti.py
          fi

      - name: Salva i compiti nel repository
        run: |
          git config user.name "orario-3ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/homework.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai compiti."
          else
            git commit -m "chore(compiti): aggiorna dati $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Il push fatto con GITHUB_TOKEN non fa partire altri workflow:
      # chiediamo esplicitamente a GitHub Pages di ricostruire il sito.
      # (Se Pages non è attivo o usa un'altra sorgente, lo step viene ignorato.)
      - name: Richiedi aggiornamento GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            || echo "Build GitHub Pages non richiesta (sorgente non compatibile)."
