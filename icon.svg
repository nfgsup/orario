<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#448aff"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e3ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- graduation cap -->
  <g transform="translate(256 256)">
    <!-- mortarboard top -->
    <path d="M -150 -30 L 0 -90 L 150 -30 L 0 30 Z" fill="url(#cap)"/>
    <!-- cap body -->
    <path d="M -70 5 L -70 55 Q 0 100 70 55 L 70 5 L 0 35 Z" fill="url(#cap)" opacity="0.92"/>
    <!-- tassel -->
    <line x1="150" y1="-30" x2="150" y2="40" stroke="#ffffff" stroke-width="6"/>
    <circle cx="150" cy="50" r="14" fill="#00e676"/>
  </g>
  <!-- 3Ai text -->
  <text x="256" y="430" font-family="Outfit, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">3Ai</text>
</svg>
